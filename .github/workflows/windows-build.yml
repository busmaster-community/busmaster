name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Release (Win32)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      error_count: ${{ steps.build.outputs.error_count }}
      warning_count: ${{ steps.build.outputs.warning_count }}
      build_exit_code: ${{ steps.build.outputs.build_exit_code }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Calculate semantic version
        id: version
        shell: pwsh
        run: ./scripts/get-semantic-version.ps1

      - name: Build BUSMASTER
        id: build
        shell: pwsh
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'busmaster-build.log'
          $diagnosticsPath = Join-Path $env:RUNNER_TEMP 'busmaster-build-diagnostics.md'
          $buildExitCode = 0

          try {
            & .\scripts\build-windows.ps1 -Version '${{ steps.version.outputs.version }}' *>&1 |
              Tee-Object -FilePath $buildLog
            if ($LASTEXITCODE -ne 0) {
              $buildExitCode = $LASTEXITCODE
            }
          }
          catch {
            $_ | Out-String | Add-Content -LiteralPath $buildLog
            $buildExitCode = 1
          }

          $buildLines = @(Get-Content -LiteralPath $buildLog)
          $errorLines = @($buildLines | Where-Object { $_ -match '(?i)\b(?:fatal\s+)?error\s+[A-Z]+\d+\b' })
          $warningLines = @($buildLines | Where-Object { $_ -match '(?i)\bwarning(?:\s+[A-Z]+\d+\b|\s*:)' })
          $errorCount = $errorLines.Count
          $warningCount = $warningLines.Count

          @"
          Build exit code: $buildExitCode
          Errors: $errorCount
          Warnings: $warningCount
          "@ | Set-Content -LiteralPath $diagnosticsPath -Encoding utf8

          "error_count=$errorCount" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "warning_count=$warningCount" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "build_exit_code=$buildExitCode" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

          @"
          ### Windows build diagnostics

          | Errors | Warnings | Build exit code |
          | ---: | ---: | ---: |
          | $errorCount | $warningCount | $buildExitCode |
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if ($buildExitCode -ne 0) {
            throw "BUSMASTER build failed with exit code $buildExitCode. See the Windows build diagnostics artifact."
          }

      - name: Store build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/busmaster-build.log
            ${{ runner.temp }}/busmaster-build-diagnostics.md
          if-no-files-found: warn
          retention-days: 14

      - name: Package BUSMASTER binaries
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $binaryDirectory = Join-Path $env:GITHUB_WORKSPACE 'Sources\BUSMASTER\BIN\Release'
          if (-not (Test-Path (Join-Path $binaryDirectory 'BUSMASTER.exe'))) {
            throw 'BUSMASTER.exe was not produced by the build.'
          }

          $stagingDirectory = Join-Path $env:RUNNER_TEMP "busmaster-package-$($env:COMMIT_SHA)"
          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null
          Get-ChildItem -LiteralPath $binaryDirectory -Force | Copy-Item -Destination $stagingDirectory -Recurse -Force
          Get-ChildItem -LiteralPath $stagingDirectory -File -Recurse |
            Where-Object { $_.Extension -in @('.exp', '.idb', '.ilk', '.iobj', '.ipdb', '.lib', '.map', '.obj', '.pch', '.pdb', '.recipe', '.sbr') } |
            Remove-Item -Force

          $zipName = "BUSMASTER_$($env:VERSION)_Win32.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path (Join-Path $stagingDirectory '*') -DestinationPath $zipPath -CompressionLevel Optimal
          "artifact_name=busmaster-$($env:VERSION)-$($env:COMMIT_SHA)" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Store build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

  report-build-diagnostics:
    name: Report build diagnostics
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.build.outputs.error_count != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Update PR diagnostics comment
        uses: actions/github-script@v7
        env:
          ERROR_COUNT: ${{ needs.build.outputs.error_count }}
          WARNING_COUNT: ${{ needs.build.outputs.warning_count }}
          BUILD_EXIT_CODE: ${{ needs.build.outputs.build_exit_code }}
        with:
          script: |
            const marker = '<!-- busmaster-build-diagnostics -->';
            const passed = process.env.BUILD_EXIT_CODE === '0';
            const body = `${marker}
            ### Windows build diagnostics

            - Result: **${passed ? 'passed' : 'failed'}**
            - Errors: **${process.env.ERROR_COUNT}**
            - Warnings: **${process.env.WARNING_COUNT}**
            - [Build log and diagnostics artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  release:
    name: Publish semantic release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          asset="release-assets/BUSMASTER_${VERSION}_Win32.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            notes_args=()
            if [ -n "$PREVIOUS_TAG" ]; then
              notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            gh release create "$tag" "$asset" --target "$TARGET_SHA" \
              --title "BUSMASTER $tag" --generate-notes "${notes_args[@]}"
          fi
