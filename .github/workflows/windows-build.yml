name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Release (Win32)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build BUSMASTER
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipIxxatDriver
